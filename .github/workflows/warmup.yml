name: Site warmup

on:
  schedule:
    # ~every 2–3h UTC, irregular minutes; each window has its own sleep range (see shell).
    # 14:11 UTC ≈ 22:11 Asia/Shanghai — daily-floor window.
    - cron: '17 1 * * *'
    - cron: '41 4 * * *'
    - cron: '8 7 * * *'
    - cron: '53 10 * * *'
    - cron: '29 13 * * *'
    - cron: '11 14 * * *'
    - cron: '37 17 * * *'
    - cron: '3 20 * * *'
    - cron: '47 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-warmup
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Shanghai day key
        id: day
        shell: bash
        env:
          TZ: Asia/Shanghai
        run: echo "key=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore today success marker
        id: cache
        uses: actions/cache@v4
        with:
          path: .warmup-ok
          key: warmup-ok-${{ steps.day.outputs.key }}

      - name: Warm davylei.com
        id: warm
        shell: bash
        env:
          TZ: Asia/Shanghai
        run: |
          set +e
          TODAY=$(date +%F)
          HOUR=$(date +%-H)
          UTC_HOUR=$(date -u +%-H)
          MARKER=".warmup-ok"
          HAD_OK=0
          if [ -f "$MARKER" ] && grep -qx "$TODAY" "$MARKER" 2>/dev/null; then
            HAD_OK=1
          fi
          echo "today=$TODAY shanghai_hour=$HOUR utc_hour=$UTC_HOUR had_ok=$HAD_OK"

          if [ "$HAD_OK" -eq 0 ] && [ "$HOUR" -ge 22 ]; then
            DELAY_MIN=0
            echo "Daily floor: forcing immediate run (no success yet today)"
          else
            # Distinct non-uniform sleep ranges per UTC trigger hour (minutes inclusive).
            case "$UTC_HOUR" in
              1)  LO=0;   HI=110 ;;  # cron 17 1
              4)  LO=20;  HI=100 ;;  # cron 41 4
              7)  LO=5;   HI=95  ;;  # cron 8 7
              10) LO=15;  HI=105 ;;  # cron 53 10
              13) LO=0;   HI=80  ;;  # cron 29 13
              14) LO=0;   HI=50  ;;  # cron 11 14 (near Shanghai 22h)
              17) LO=10;  HI=90  ;;  # cron 37 17
              20) LO=25;  HI=115 ;;  # cron 3 20
              22) LO=0;   HI=120 ;;  # cron 47 22
              *)  LO=0;   HI=90  ;;  # workflow_dispatch / drift
            esac
            SPAN=$((HI - LO + 1))
            DELAY_MIN=$((LO + RANDOM % SPAN))
            echo "Jitter window utc_hour=$UTC_HOUR range=${LO}-${HI}m -> sleep ${DELAY_MIN}m"
          fi
          sleep $((DELAY_MIN * 60))

          BASE='https://davylei.com'
          URLS=(
            "${BASE}/"
            "${BASE}/#papers"
            "${BASE}/#projects"
            "${BASE}/#skills"
            "${BASE}/about.html"
            "${BASE}/atom.xml"
            "${BASE}/css/style.css?v=20261030video"
            "${BASE}/favicon.svg"
            "${BASE}/media/hero-poster.jpg"
            "${BASE}/media/demo-poster.jpg"
            "${BASE}/media/hero.mp4"
            "${BASE}/media/demo.mp4"
          )
          UAS=(
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
            'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_7) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Safari/605.1.15'
            'Mozilla/5.0 (X11; Linux x86_64; rv:131.0) Gecko/20100101 Firefox/131.0'
            'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_7_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 Edg/130.0.0.0'
          )
          LANGS=('zh-CN,zh;q=0.9,en;q=0.8' 'en-US,en;q=0.9' 'zh-CN,zh;q=0.8,en-US;q=0.6,en;q=0.4' 'en-GB,en;q=0.9')

          fail=0
          home_ok=0
          for url in "${URLS[@]}"; do
            ua="${UAS[$RANDOM % ${#UAS[@]}]}"
            al="${LANGS[$RANDOM % ${#LANGS[@]}]}"
            sleep $((2 + RANDOM % 9))

            attempt=0
            ok=0
            while [ "$attempt" -le 1 ]; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' \
                -L --max-time 30 \
                -A "$ua" \
                -H "Referer: ${BASE}/" \
                -H "Accept-Language: $al" \
                -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
                "$url" || echo '000')
              echo "GET $url -> $code (attempt $attempt)"
              if [[ "$code" =~ ^2 ]]; then
                ok=1
                [ "$url" = "${BASE}/" ] && home_ok=1
                break
              fi
              attempt=$((attempt + 1))
              [ "$attempt" -le 1 ] && sleep $((2 + RANDOM % 5))
            done
            [ "$ok" -eq 1 ] || fail=$((fail + 1))
          done

          if [ "$home_ok" -eq 1 ]; then
            echo "$TODAY" > "$MARKER"
            echo "wrote_marker=true" >> "$GITHUB_OUTPUT"
            echo "Recorded success marker for $TODAY"
          else
            echo "wrote_marker=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Done. soft_failures=$fail home_ok=$home_ok"
          exit 0

      - name: Persist today success marker
        if: steps.warm.outputs.wrote_marker == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .warmup-ok
          key: warmup-ok-${{ steps.day.outputs.key }}
